[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai"
dynamic = ["version"]
description = "Prédiction de panne à partir de relevés de capteurs"
readme = "README.md"
requires-python = ">=3.11"
# Ce que le code de maintai/ importe, avec une version minimale (>=)
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

# Une commande -> la fonction qu'elle appelle
[project.scripts]
maintai-predict = "maintai.cli:main"

[tool.setuptools.dynamic]
version = { attr = "maintai.__version__" }

[tool.setuptools.packages.find]
include = ["maintai*"]
